<!doctype html>
<html lang="en" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>{{.Title}}</title>
<link rel="icon" href="/favicon.ico">
<script>
(function(){try{var t=localStorage.getItem("csvl.theme")||"auto";var d=t==="dark"||(t==="auto"&&window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches);if(d){document.documentElement.classList.add("theme-dark");}document.documentElement.setAttribute("data-theme",t);}catch(e){}})();
</script>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body class="viewer">
<script>window.__CSVL = {{.Boot}};</script>

<header class="topbar">
  <div class="topbar-left">
    <a class="home" href="/" title="Recently opened files" aria-label="Recently opened files">
      <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1.5 1.5 7h1.75v6.5h3.25V9.75h3v3.75h3.25V7H15.5z" fill="currentColor"/></svg>
    </a>
    <div class="crumbs">
      <span class="filename">{{.FileName}}</span>
      <span class="dir" title="{{.FullPath}}">&lrm;{{.Dir}}</span>
    </div>
  </div>

  <div class="topbar-mid">
    <div class="searchbox">
      <svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><path d="M11.3 10.1a5 5 0 1 0-1.2 1.2l3.2 3.2 1.2-1.2zM3.5 6.5a3 3 0 1 1 6 0 3 3 0 0 1-6 0z" fill="currentColor"/></svg>
      <input id="search" type="search" spellcheck="false" autocomplete="off"
             placeholder="Search rows    (city:berlin  amount&gt;1000  -cancelled)">
      <button class="clear" id="search-clear" type="button" title="Clear" hidden>&times;</button>
    </div>
  </div>

  <div class="topbar-right">
    <span class="counts" id="counts"></span>
    <span class="badge" id="reload-badge" hidden>updated</span>
    <button class="iconbtn" id="freeze-btn" type="button" title="Freeze the first column" aria-label="Freeze the first column">
      <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M2 2h4v12H2z" fill="currentColor"/><path d="M7.5 2H14v12H7.5z" fill="currentColor" opacity=".35"/></svg>
    </button>
    <button class="iconbtn" id="options-btn" type="button" title="Delimiter, header row, encoding" aria-label="File options">
      <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 5.6A2.4 2.4 0 1 0 8 10.4 2.4 2.4 0 0 0 8 5.6zm6 3.1V7.3l-1.6-.3a4.7 4.7 0 0 0-.5-1.2l.9-1.3-1-1-1.3.9a4.7 4.7 0 0 0-1.2-.5L9 2.3H7.3L7 3.9c-.4.1-.8.3-1.2.5l-1.3-.9-1 1 .9 1.3c-.2.4-.4.8-.5 1.2l-1.6.3v1.4l1.6.3c.1.4.3.8.5 1.2l-.9 1.3 1 1 1.3-.9c.4.2.8.4 1.2.5l.3 1.6h1.4l.3-1.6c.4-.1.8-.3 1.2-.5l1.3.9 1-1-.9-1.3c.2-.4.4-.8.5-1.2z" fill="currentColor"/></svg>
    </button>
    <button class="iconbtn" id="theme-toggle" type="button" title="Light / dark / auto" aria-label="Switch theme">
      <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true" class="i-sun"><circle cx="8" cy="8" r="3.2" fill="currentColor"/><path d="M8 .8v2.1M8 13.1v2.1M.8 8h2.1M13.1 8h2.1M2.9 2.9l1.5 1.5M11.6 11.6l1.5 1.5M13.1 2.9l-1.5 1.5M4.4 11.6l-1.5 1.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
      <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true" class="i-moon"><path d="M13.4 9.9A5.8 5.8 0 0 1 6.1 2.6a5.9 5.9 0 1 0 7.3 7.3z" fill="currentColor"/></svg>
    </button>
    <button class="iconbtn" id="print-btn" type="button" title="Print or save as PDF" aria-label="Print">
      <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 1.5h8V5H4zM2 6h12v5h-2.5v3.5h-7V11H2zm3.5 5h5v2h-5z" fill="currentColor"/></svg>
    </button>
  </div>
</header>

<div class="notices" id="notices"></div>

<div class="grid" id="grid" tabindex="0">
  <table id="table">
    <colgroup id="cols"></colgroup>
    <thead id="head"></thead>
    <tbody id="body"></tbody>
  </table>
  <div class="empty-state" id="empty" hidden></div>
</div>

<footer class="inspector" id="inspector" hidden>
  <span class="ins-label" id="ins-label"></span>
  <span class="ins-value" id="ins-value"></span>
  <button class="ghostbtn" id="ins-copy" type="button">Copy</button>
  <button class="iconbtn small" id="ins-close" type="button" title="Close" aria-label="Close">&times;</button>
</footer>

<div class="popover" id="popover" hidden></div>
<div class="sheet" id="options" hidden></div>

<script src="/assets/app.js"></script>
</body>
</html>
